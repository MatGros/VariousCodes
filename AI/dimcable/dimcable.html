<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dimensionnement de Câbles Électriques - DimCable MGS-05</title>
    <link rel="stylesheet" href="dimcable.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Outil de Dimensionnement de Câbles Électriques</h1>
            <p class="subtitle">Conforme aux normes NF C 15-100 & IEC 60364</p>
        </header>

        <!-- Tabs de mode -->
        <div class="tabs">
            <button class="tab active" data-mode="section">1. Calcul de Section</button>
            <button class="tab" data-mode="distance">2. Distance Maximale</button>
            <button class="tab" data-mode="current">3. Courant Maximal</button>
        </div>

        <main class="main-grid">
            <!-- PANNEAU D'ENTRÉES -->
            <div class="panel input-panel" id="input-panel-pdf">
                <h2>Paramètres d'Entrée</h2>

                <div class="input-group">
                    <label>Type de câble</label>
                    <select id="cableType">
                        <option>U-1000 R2V</option>
                        <option>HO7RNF</option>
                        <option disabled>HO7VK (bientôt)</option>
                    </select>
                </div>

                <div class="input-row">
                    <div class="input-group">
                        <label>Conducteurs</label>
                        <select id="conductors">
                            <option>2G</option>
                            <option selected>3G</option>
                            <option>4G</option>
                            <option>5G</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>Matériau</label>
                        <select id="material">
                            <option value="Cu">Cuivre</option>
                            <option value="Al" disabled>Aluminium</option>
                        </select>
                    </div>
                </div>

                <div class="input-group">
                    <label>Tension Nominale</label>
                    <select id="voltage">
                        <option value="230">230V Monophasé</option>
                        <option value="400">400V Triphasé</option>
                        <option value="0">Autre</option>
                    </select>
                    <input type="number" id="customVoltage" placeholder="Tension (V)" class="hidden" min="1" step="1">
                </div>

                <div class="checkbox-group">
                    <label for="isMotorMode">
                        <input type="checkbox" id="isMotorMode">
                        Mode Moteur (chute de tension max 5%)
                    </label>
                </div>

                <!-- Inputs spécifiques Mode 1 -->
                <div class="mode-inputs mode-section">
                    <div class="input-row">
                        <div class="input-group">
                            <label>Courant (A)</label>
                            <input type="number" id="current" value="32" min="0.1" step="0.1">
                        </div>
                        <div class="input-group">
                            <label>Puissance (kW)</label>
                            <input type="number" id="power" value="6.62" min="0" step="0.1">
                        </div>
                    </div>
                </div>

                <!-- Inputs spécifiques Mode 2 -->
                <div class="mode-inputs mode-distance hidden">
                    <div class="input-group">
                        <label>Section de câble (mm²)</label>
                        <select id="givenSection">
                            <!-- Options générées dynamiquement -->
                        </select>
                    </div>
                    <div class="input-group">
                        <label>Courant (A)</label>
                        <input type="number" id="currentMode2" value="32" min="0.1" step="0.1">
                    </div>
                    <div class="input-group">
                        <label>Chute de tension max (%)</label>
                        <input type="number" id="maxVoltageDrop" value="3" min="0.1" max="10" step="0.1">
                    </div>
                </div>

                <!-- Inputs spécifiques Mode 3 -->
                <div class="mode-inputs mode-current hidden">
                    <div class="input-group">
                        <label>Section de câble (mm²)</label>
                        <select id="givenSectionMode3">
                            <!-- Options générées dynamiquement -->
                        </select>
                    </div>
                </div>

                <!-- Distance (sauf mode 2) -->
                <div class="input-group distance-input">
                    <label>Distance (m)</label>
                    <input type="number" id="distance" value="50" min="0.1" step="0.1">
                </div>

                <div class="input-group">
                    <label>Facteur de Puissance (cos φ): <span id="powerFactorValue">0.90</span></label>
                    <input type="range" id="powerFactor" min="0.6" max="1.0" step="0.01" value="0.9">
                </div>

                <div class="input-group">
                    <label>Mode de Pose</label>
                    <select id="installation">
                        <option>Chemin de câbles perforé</option>
                        <option>Chemin de câbles non perforé</option>
                        <option>Enterré direct</option>
                        <option>Sous conduit apparent</option>
                        <option>Sous goulotte</option>
                        <option>En vide de construction</option>
                    </select>
                </div>

                <div class="input-row">
                    <div class="input-group">
                        <label>Temp. Ambiante (°C)</label>
                        <select id="temperature">
                            <option value="20">20</option>
                            <option value="25">25</option>
                            <option value="30" selected>30</option>
                            <option value="35">35</option>
                            <option value="40">40</option>
                            <option value="45">45</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>Circuits Adjacents</label>
                        <select id="circuits">
                            <option value="1" selected>1</option>
                            <option value="2">2</option>
                            <option value="3">3</option>
                            <option value="4">4</option>
                            <option value="5+">5+</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- PANNEAU RÉSULTATS -->
            <div class="results-area">
                <div class="panel results-panel" id="results-panel">
                    <h2>Résultats & Graphiques</h2>
                    <div id="results-content">
                        <!-- Contenu généré dynamiquement -->
                    </div>
                </div>

                <div class="panel recommendations-panel" id="recommendations-panel">
                    <h2>Préconisations & Alertes</h2>
                    <div id="recommendations-content">
                        <p class="text-muted">En attente de calculs valides...</p>
                    </div>
                </div>
            </div>
        </main>

        <!-- FOOTER ACTIONS -->
        <footer>
            <div class="actions">
                <button id="btnReset" class="btn btn-secondary">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                        <path d="M3 3v5h5"/>
                        <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/>
                        <path d="M21 21v-5h-5"/>
                    </svg>
                    Réinitialiser
                </button>
                <button id="btnExportCSV" class="btn btn-primary">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                        <polyline points="7 10 12 15 17 10"/>
                        <line x1="12" y1="15" x2="12" y2="3"/>
                    </svg>
                    Exporter CSV
                </button>
                <button id="btnExportPDF" class="btn btn-primary">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/>
                        <polyline points="14 2 14 8 20 8"/>
                    </svg>
                    Exporter PDF
                </button>
            </div>
            <div class="expert-toggle">
                <label for="expertToggle">Mode Expert</label>
                <input type="checkbox" id="expertToggle">
            </div>
        </footer>

        <!-- PANNEAU EXPERT (caché par défaut) -->
        <div class="panel expert-panel hidden" id="expert-panel">
            <h3>Détails du Calcul (Mode Expert)</h3>
            <pre id="expert-content"></pre>
        </div>
    </div>

    <!-- Chart.js depuis CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

    <!-- jsPDF et html2canvas pour export PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <!-- Application JavaScript -->
    <script src="dimcable.js"></script>
</body>
</html>
